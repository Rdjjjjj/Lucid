name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' apps/macos/Info.plist)
          for plist in apps/macos/SettingsInfo.plist LucidApp/Info.plist LucidInputMethod/Info.plist; do
            actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
            [[ "$actual" == "$app_version" ]] || { echo "$plist version $actual does not match $app_version"; exit 1; }
          done
          [[ "$version" == "$app_version" ]] || { echo "Tag $TAG_NAME does not match app version $app_version"; exit 1; }

      - name: Check public-release hygiene
        run: ./scripts/check-public-release.sh

      - name: Run tests
        run: |
          cargo test --workspace
          swift test
          xcodebuild -project Lucid.xcodeproj -scheme LucidApp -configuration Debug -sdk macosx -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test

      - name: Build universal installer
        run: ./scripts/build-dmg.sh

      - name: Verify release artifact
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="dist/Lucid-${version}.pkg"
          test -s "$pkg"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/Lucid-${version}.pkg" \
            --verify-tag \
            --title "Lucid ${version}" \
            --generate-notes
