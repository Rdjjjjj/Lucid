name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' LucidApp/Info.plist)
          input_method_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' LucidInputMethod/Info.plist)
          [[ "$version" == "$app_version" ]] || { echo "Tag $TAG_NAME does not match app version $app_version"; exit 1; }
          [[ "$app_version" == "$input_method_version" ]] || { echo "App/input method versions differ"; exit 1; }

      - name: Check public-release hygiene
        run: ./scripts/check-public-release.sh

      - name: Run tests
        run: |
          swift test
          xcodebuild -project Lucid.xcodeproj -scheme LucidApp -configuration Debug -sdk macosx -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test

      - name: Build universal installer
        run: ./scripts/build-dmg.sh

      - name: Verify release artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="dist/Lucid-${version}.dmg"
          pkg="dist/Lucid-${version}.pkg"
          test -s "$dmg"
          test -s "$pkg"
          (cd dist && shasum -a 256 "Lucid-${version}.dmg" "Lucid-${version}.pkg") > dist/SHA256SUMS
          {
            echo "### Release artifact checksums"
            echo
            echo '\`\`\`'
            cat dist/SHA256SUMS
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/Lucid-${version}.dmg" \
            "dist/Lucid-${version}.pkg" \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Lucid ${version}" \
            --generate-notes
